<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="956" viewBox="0 0 1200 956" role="img" aria-labelledby="title desc">
<title id="title">From request to release</title><desc id="desc">Google Sheets and BA discussion feed read-only intake, repository-grounded impact and change estimates, and a human BA decision. A frozen handoff enters LangGraph, validation, separate Data Engineer approval and export. Live Google authentication is pending; production merge and release are future integrations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#587286"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#183449}.title{font-size:32px;font-weight:700}.subtitle{font-size:17px;fill:#526779}.heading{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#526779}.kicker{font-size:14px;font-weight:700;letter-spacing:1px;fill:#3d6578}.link{fill:none;stroke:#587286;stroke-width:2.5;marker-end:url(#arrow)}.future{stroke-dasharray:7 5}
</style></defs>
<rect width="1200" height="956" fill="#fff"/>
<text x="40" y="52" class="title" >From request to release</text><text x="40" y="82" class="subtitle" >A realistic BA-to-Data-Engineer workflow · Satoshi Nakamura · Solo</text><text x="40" y="112" class="kicker" >INTAKE AND BUSINESS DECISION</text><text x="650" y="112" class="kicker" >BOUNDED DELIVERY DEMO</text><rect x="40" y="130" width="505" height="94" rx="12" fill="#f1f6f9" stroke="#afc3d0" stroke-width="1.5" /><text x="60" y="161" class="heading" >1  User request + BA discussion</text><text x="60" y="187" class="body" >Google Sheet, meetings and Slack retain context.</text>
<text x="60" y="210" class="body" >Agree the objective, desired date and acceptance criteria.</text><rect x="40" y="240" width="505" height="94" rx="12" fill="#f1f6f9" stroke="#afc3d0" stroke-width="1.5" /><text x="60" y="271" class="heading" >2  Read the private backlog</text><text x="60" y="297" class="body" >Read-only Google connection; first OAuth setup pending.</text>
<text x="60" y="320" class="body" >Local synthetic snapshot is available without login.</text><rect x="40" y="350" width="505" height="228" rx="12" fill="#f1f6f9" stroke="#afc3d0" stroke-width="1.5" /><text x="60" y="381" class="heading" >3  Compare impact × change volume</text><text x="60" y="407" class="small" >Repository/dbt evidence → provisional estimates + confidence</text><rect x="60" y="424" width="222" height="63" rx="12" fill="#ddf3eb" stroke="#9bc7b5" stroke-width="1.5" /><text x="72" y="448" class="small" >High impact / small change</text><text x="72" y="471" class="body" >Candidate to start</text><rect x="298" y="424" width="227" height="63" rx="12" fill="#e5edf8" stroke="#b2c6e0" stroke-width="1.5" /><text x="310" y="448" class="small" >High impact / large change</text><text x="310" y="471" class="body" >Plan or split</text><rect x="60" y="499" width="222" height="63" rx="12" fill="#f0f3f6" stroke="#c7d1da" stroke-width="1.5" /><text x="72" y="523" class="small" >Low impact / small change</text><text x="72" y="546" class="body" >Batch when useful</text><rect x="298" y="499" width="227" height="63" rx="12" fill="#f8ede7" stroke="#ddc3b4" stroke-width="1.5" /><text x="310" y="523" class="small" >Low impact / large change</text><text x="310" y="546" class="body" >Consider deferring</text><rect x="40" y="604" width="505" height="94" rx="12" fill="#ddf3eb" stroke="#62a98c" stroke-width="1.5" /><text x="60" y="635" class="heading" >4  Human BA Go / Hold / Clarify</text><text x="60" y="661" class="body" >BA reviews the recommendation and records a reason.</text>
<text x="60" y="684" class="body" >Go selects a ready, supported request for delivery.</text><rect x="650" y="130" width="510" height="94" rx="12" fill="#f1f6f9" stroke="#afc3d0" stroke-width="1.5" /><text x="670" y="161" class="heading" >5  Freeze a Jira-like handoff</text><text x="670" y="187" class="body" >Save the selected request, evidence and BA decision.</text>
<text x="670" y="210" class="body" >Snapshot and receipt identify what was authorized.</text><rect x="650" y="240" width="510" height="115" rx="12" fill="#f1f6f9" stroke="#afc3d0" stroke-width="1.5" /><text x="670" y="271" class="heading" >6  LangGraph coordinates AI steps</text><text x="670" y="297" class="body" >Structured Output → repository RAG → change plan.</text>
<text x="670" y="320" class="body" >Generate SQL, tests, docs and BI-as-Code proposals.</text>
<text x="670" y="343" class="body" >Use sample mode or optional OpenAI API calls.</text><rect x="650" y="371" width="510" height="94" rx="12" fill="#f1f6f9" stroke="#afc3d0" stroke-width="1.5" /><text x="670" y="402" class="heading" >7  Validate the proposed changes</text><text x="670" y="428" class="body" >Run dbt + DuckDB + pytest in an isolated workspace.</text>
<text x="670" y="451" class="body" >Failed checks require revision before approval.</text><rect x="650" y="481" width="510" height="94" rx="12" fill="#ddf3eb" stroke="#62a98c" stroke-width="1.5" /><text x="670" y="512" class="heading" >8  Separate human DE approval</text><text x="670" y="538" class="body" >Data Engineer reviews evidence, diff and test results.</text>
<text x="670" y="561" class="body" >Approve, reject or request a revision.</text><rect x="650" y="604" width="510" height="94" rx="12" fill="#e8f4f0" stroke="#91b7a8" stroke-width="1.5" /><text x="670" y="635" class="heading" >9  Export the review package</text><text x="670" y="661" class="body" >Patch, validation results and recorded decisions.</text>
<text x="670" y="684" class="body" >Approval records readiness; it does not deploy code.</text><rect x="650" y="748" width="510" height="77" rx="12" fill="#fff" stroke="#8296a6" stroke-width="1.5" stroke-dasharray="7 5"/><text x="670" y="780" class="heading" >Future: merge → release → monitoring</text><text x="670" y="806" class="body" >Requires real integrations and release controls.</text><path d="M292 224V240" class="link"/><path d="M292 334V350" class="link"/><path d="M292 578V604" class="link"/><path d="M545 651H597V177H650" class="link"/><text x="574" y="718" class="small" text-anchor="middle">Selected request</text><path d="M905 224V240" class="link"/><path d="M905 355V371" class="link"/><path d="M905 465V481" class="link"/><path d="M905 575V604" class="link"/><text x="923" y="594" class="small" >checks pass + approval</text><path d="M905 698V748" class="link future"/><rect x="40" y="748" width="505" height="77" rx="12" fill="#f5f7f9" stroke="#c3cfd8" stroke-width="1.5" /><text x="60" y="777" class="heading" >MVP boundary</text><text x="60" y="800" class="small" >Triage covers broad requests; code generation supports</text>
<text x="60" y="819" class="small" >only revenue status-exclusion changes in the sample repo.</text><rect x="40" y="861" width="1120" height="47" rx="12" fill="#132f45" stroke="#132f45" stroke-width="1.5" /><text x="60" y="891" class="body" style="fill:#fff">Two human gates: BA authorizes the request; DE approves the validated change.</text><text x="40" y="932" class="small" >Solid arrows: local MVP flow   ·   Dashed step: future work   ·   Sheet decisions are logged locally, not written back.</text>
</svg>
