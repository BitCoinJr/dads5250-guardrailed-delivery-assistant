<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="730" viewBox="0 0 1800 730">
<title>Three course techniques, connected in a controlled workflow</title><desc>T1 defines the AI output. T2 supplies project evidence. T3 controls the stages and stopping points.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#185F91"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#758493"/></marker></defs>
<rect width="1800" height="730" fill="white"/>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#173449}.title{font-size:39px;font-weight:700}.subtitle{font-size:28px;fill:#496174}.head{font-size:30px;font-weight:700}.body{font-size:28px}.small{font-size:26px}.note{font-size:26px;fill:#496174}.arrow{stroke:#185F91;stroke-width:3;fill:none;marker-end:url(#a)}.future{stroke:#758493;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#g)}</style>
<text x="40" y="50" class="title" text-anchor="start">Three course techniques, connected in a controlled workflow</text>
<text x="40" y="94" class="subtitle" text-anchor="start">T1 defines the AI output. T2 supplies project evidence. T3 controls the stages and stopping points.</text>
<rect x="40" y="122" width="440" height="42" rx="14" fill="#7445A0" stroke="#7445A0" stroke-width="2"/><text x="260.0" y="151" class="small" text-anchor="middle" style="fill:white">T1   STRUCTURED OUTPUT</text>
<rect x="505" y="122" width="320" height="42" rx="14" fill="#185F91" stroke="#185F91" stroke-width="2"/><text x="665.0" y="151" class="small" text-anchor="middle" style="fill:white">T2   RAG</text>
<rect x="850" y="122" width="470" height="42" rx="14" fill="#08776D" stroke="#08776D" stroke-width="2"/><text x="1085.0" y="151" class="small" text-anchor="middle" style="fill:white">T3   AGENTS / LANGGRAPH</text>
<text x="40" y="207" class="body" text-anchor="start">Before the graph: BA triage reuses T1 typed estimates + T2 repository evidence; a human chooses Go.</text>
<rect x="40" y="239" width="1720" height="376" rx="14" fill="#F5FAF8" stroke="#7EAFA6" stroke-width="2"/>
<rect x="65" y="256" width="435" height="42" rx="14" fill="#08776D" stroke="#08776D" stroke-width="2"/><text x="282.5" y="285" class="small" text-anchor="middle" style="fill:white">T3   LangGraph state workflow</text>
<text x="530" y="285" class="small" text-anchor="start" style="fill:#08776D">Fixed stages + conditional stops for unsafe or unclear work</text>
<rect x="65" y="326" width="386" height="216" rx="14" fill="#FFFFFF" stroke="#A2B8C4" stroke-width="2"/>
<text x="258" y="366" class="head" text-anchor="middle">1  Parse request</text>
<text x="258" y="410" class="small" text-anchor="middle">OpenAI → typed ticket</text>
<text x="258" y="447" class="small" text-anchor="middle">Pydantic + business rules</text>
<text x="258" y="484" class="small" text-anchor="middle">Clarify if policy is unclear</text>
<text x="258" y="571" class="small" text-anchor="middle" style="fill:#496174">parse_request</text>
<path d="M454 437 H485" class="arrow"/>
<rect x="77" y="303" width="74" height="42" rx="14" fill="#7445A0" stroke="#7445A0" stroke-width="2"/><text x="114.0" y="332" class="small" text-anchor="middle" style="fill:white">T1</text>
<rect x="493" y="326" width="386" height="216" rx="14" fill="#FFFFFF" stroke="#A2B8C4" stroke-width="2"/>
<text x="686" y="366" class="head" text-anchor="middle">2  Retrieve evidence</text>
<text x="686" y="410" class="small" text-anchor="middle">Local lexical TF-IDF</text>
<text x="686" y="447" class="small" text-anchor="middle">Known revenue file links</text>
<text x="686" y="484" class="small" text-anchor="middle">Cited, allowlisted excerpts</text>
<text x="686" y="571" class="small" text-anchor="middle" style="fill:#496174">retrieve_evidence</text>
<path d="M882 437 H913" class="arrow"/>
<rect x="505" y="303" width="74" height="42" rx="14" fill="#185F91" stroke="#185F91" stroke-width="2"/><text x="542.0" y="332" class="small" text-anchor="middle" style="fill:white">T2</text>
<rect x="921" y="326" width="386" height="216" rx="14" fill="#FFFFFF" stroke="#A2B8C4" stroke-width="2"/>
<text x="1114" y="366" class="head" text-anchor="middle">3  Plan + generate</text>
<text x="1114" y="410" class="small" text-anchor="middle">OpenAI → typed proposal</text>
<text x="1114" y="447" class="small" text-anchor="middle">Plan, risks and four files</text>
<text x="1114" y="484" class="small" text-anchor="middle">Canonical policy checks</text>
<text x="1114" y="571" class="small" text-anchor="middle" style="fill:#496174">plan_and_generate</text>
<path d="M1310 437 H1341" class="arrow"/>
<rect x="933" y="303" width="74" height="42" rx="14" fill="#7445A0" stroke="#7445A0" stroke-width="2"/><text x="970.0" y="332" class="small" text-anchor="middle" style="fill:white">T1</text>
<rect x="1349" y="326" width="386" height="216" rx="14" fill="#FFFFFF" stroke="#A2B8C4" stroke-width="2"/>
<text x="1542" y="366" class="head" text-anchor="middle">4  Validate changes</text>
<text x="1542" y="410" class="small" text-anchor="middle">Separate run workspace</text>
<text x="1542" y="447" class="small" text-anchor="middle">dbt + trusted pytest</text>
<text x="1542" y="484" class="small" text-anchor="middle">Independent revenue total</text>
<text x="1542" y="571" class="small" text-anchor="middle" style="fill:#496174">validate_changes</text>
<text x="66" y="601" class="small" text-anchor="start">Only predefined commands and allowlisted file paths can reach execution. The model has no unrestricted tools.</text>
<rect x="40" y="643" width="1720" height="65" rx="14" fill="#EFF8F5" stroke="#7EAFA6" stroke-width="2"/>
<text x="65" y="684" class="body" text-anchor="start">Human gates sit outside the graph: BA Go → controlled workflow → DE review → approved patch export.</text>
</svg>